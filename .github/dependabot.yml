# ==============================================================================
# Open Cloud Agents: Dependabot Configuration
#
# Daily automated dependency and vulnerability scanning.
# Scheduled daily at 04:00 EET (02:00 UTC).
# Notifications and PR reviews assigned to @ibrahimng.
# Commits are automatically signed off by dependabot[bot] via .github/workflows/dependabot-signoff.yml
# ==============================================================================

version: 2
updates:
  # 1. GitHub Actions CI/CD Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Etc/UTC"
    assignees:
      - "Ibrahimng"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "automated"
    ignore:
      - dependency-name: "dorny/paths-filter"
        versions: ["4.x"]
      - dependency-name: "actions/setup-python"
        versions: ["7.x"]
      - dependency-name: "softprops/action-gh-release"
        versions: ["3.x"]

  # 2. Python Dependencies (CI, Documentation & Scripts)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Etc/UTC"
    assignees:
      - "Ibrahimng"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "python"

