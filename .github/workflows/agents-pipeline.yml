name: Agents Orchestration & Handoff Pipeline

on:
  push:
    paths:
      - "agents/**"
      - "scripts/agents/**"
      - ".github/workflows/agents-pipeline.yml"
    branches: [ main ]
  pull_request:
    paths:
      - "agents/**"
      - "scripts/agents/**"
      - ".github/workflows/agents-pipeline.yml"
    branches: [ main ]
  workflow_dispatch:
    inputs:
      task:
        description: "Architectural task to run through the 7-Agent Master Suite"
        required: false
        default: "Architect zero-downtime database migration to multi-region Aurora Global Database with SOC2 compliance"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-agent-specs:
    name: Agent Persona & Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate 7-Agent Master Suite Contracts
        run: |
          python3 scripts/agents/agent_pipeline.py --validate

  run-agent-handoff-pipeline:
    name: Multi-Agent Handoff Pipeline Simulation
    needs: validate-agent-specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Execute 6-Stage Multi-Agent Handoff
        run: |
          TASK_INPUT="${{ github.event.inputs.task }}"
          if [ -z "$TASK_INPUT" ]; then
            python3 scripts/agents/agent_pipeline.py --simulate --export-json execution_trace.json
          else
            python3 scripts/agents/agent_pipeline.py --task "$TASK_INPUT" --export-json execution_trace.json
          fi

      - name: Upload Pipeline Execution Trace Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: agent-execution-trace
          path: execution_trace.json
          retention-days: 7

  agent-pr-audit:
    name: DevSecOps Reviewer Automated PR Audit
    if: github.event_name == 'pull_request'
    needs: run-agent-handoff-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run DevSecOps Automated Review on Diff
        id: review
        run: |
          python3 -c "
          import subprocess, sys

          print('Auditing PR changes against Well-Architected Framework guardrails...')
          diff_cmd = ['git', 'diff', 'origin/${{ github.base_ref }}...HEAD']
          res = subprocess.run(diff_cmd, capture_output=True, text=True)
          diff = res.stdout

          # Context-aware audit: inspect added code in IaC/scripts, excluding markdown docs
          flags = []
          current_file = ''

          for line in diff.splitlines():
              if line.startswith('diff --git'):
                  parts = line.split()
                  current_file = parts[2][2:] if len(parts) > 2 else ''
              elif line.startswith('+') and not line.startswith('+++'):
                  # Skip documentation, markdown checklists, and prose
                  if current_file.endswith('.md'):
                      continue

                  stripped = line[1:].strip()
                  # Skip code comments
                  if stripped.startswith(('#', '//', '/*', '*')):
                      continue

                  # Check for real IaC traps and security risks in code
                  if 'force_destroy = true' in stripped.lower() or 'forces replacement' in stripped.lower():
                      flags.append(f'⚠️ Potential state destruction or force replacement detected in `{current_file}`: `{stripped[:60]}`')
                  if '0.0.0.0/0' in stripped and ('ingress' in stripped.lower() or 'cidr_blocks' in stripped.lower()):
                      flags.append(f'🚨 Open ingress to 0.0.0.0/0 detected in `{current_file}`: `{stripped[:60]}`')
                  if 'chmod 777' in stripped:
                      flags.append(f'🚨 Permissive chmod 777 detected in `{current_file}`: `{stripped[:60]}`')

          summary = '### 🛡️ DevSecOps Reviewer: Automated PR Audit Summary\n\n'
          summary += '**Verdict:** ' + ('⚠️ Needs Human Review' if flags else '✅ Clean - No High-Risk Traps Detected') + '\n\n'
          if flags:
              summary += '**Flags Raised:**\n' + '\n'.join(f'- {f}' for f in flags) + '\n'
          else:
              summary += '- No destructive IaC replacements, open ingress rules, or credential leaks detected.\n'
              summary += '- All changes comply with pre-merge Well-Architected safety baselines.\n'
          
          with open('pr_review.md', 'w') as f:
              f.write(summary)
          print(summary)
          "

      - name: Post PR Review Comment
        uses: actions/github-script@v9
        if: always()
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_review.md')) {
              const body = fs.readFileSync('pr_review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

