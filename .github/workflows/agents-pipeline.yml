name: Agents Orchestration & Handoff Pipeline

on:
  push:
    paths:
      - "agents/**"
      - "scripts/agents/**"
      - ".github/workflows/agents-pipeline.yml"
    branches: [ main ]
  pull_request:
    paths:
      - "agents/**"
      - "scripts/agents/**"
      - ".github/workflows/agents-pipeline.yml"
    branches: [ main ]
  workflow_dispatch:
    inputs:
      task:
        description: "Architectural task to run through the 7-Agent Master Suite"
        required: false
        default: "Architect zero-downtime database migration to multi-region Aurora Global Database with SOC2 compliance"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-agent-specs:
    name: Agent Persona & Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate 7-Agent Master Suite Contracts
        run: |
          python3 scripts/agents/agent_pipeline.py --validate

  run-agent-handoff-pipeline:
    name: Multi-Agent Handoff Pipeline Simulation
    needs: validate-agent-specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Execute 6-Stage Multi-Agent Handoff
        run: |
          TASK_INPUT="${{ github.event.inputs.task }}"
          if [ -z "$TASK_INPUT" ]; then
            python3 scripts/agents/agent_pipeline.py --simulate --export-json execution_trace.json
          else
            python3 scripts/agents/agent_pipeline.py --task "$TASK_INPUT" --export-json execution_trace.json
          fi

      - name: Upload Pipeline Execution Trace Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: agent-execution-trace
          path: execution_trace.json
          retention-days: 7

  agent-pr-audit:
    name: DevSecOps Reviewer Automated PR Audit
    if: github.event_name == 'pull_request'
    needs: run-agent-handoff-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run DevSecOps Automated Review on Diff
        id: review
        run: |
          python3 scripts/ci/audit_pr_diff.py "${{ github.base_ref }}"

      - name: Antigravity-AI Autonomous DevSecOps Review & Approval
        uses: actions/github-script@v9
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_review.md')) {
              console.log('No review summary found.');
              return;
            }

            const summary = fs.readFileSync('pr_review.md', 'utf8');
            const isClean = summary.includes('Verdict: ✅ Clean');

            // Fetch existing reviews to ensure idempotency
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const alreadyApproved = reviews.some(
              r => r.user.login === 'github-actions[bot]' && r.state === 'APPROVED'
            );

            if (isClean) {
              if (!alreadyApproved) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'APPROVE',
                  body: `### 🤖 Antigravity-AI: Autonomous DevSecOps Approval\n\n${summary}\n\n> *Approved autonomously by Antigravity-AI based on clean pre-merge security and Well-Architected compliance verification.*`
                });
                console.log('✅ Submitted formal APPROVE review as Antigravity-AI.');
              } else {
                console.log('ℹ️ PR already approved by Antigravity-AI.');
              }
            } else {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                body: `### 🤖 Antigravity-AI: DevSecOps Review Findings\n\n${summary}\n\n> *⚠️ Human review required before merge.*`
              });
              console.log('⚠️ Submitted findings comment due to flagged items.');
            }

