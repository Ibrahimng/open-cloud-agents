name: Dependabot Automated Sign-off

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-signoff:
    name: Sign Off Dependabot Commits (DCO)
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply DCO Sign-off
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"

          LATEST_MSG=$(git log -1 --pretty=%B)
          echo "Checking latest commit message..."
          echo "----------------------------------------"
          echo "$LATEST_MSG"
          echo "----------------------------------------"

          if echo "$LATEST_MSG" | grep -q "Signed-off-by: dependabot\[bot\] <49699333+dependabot\[bot\]@users.noreply.github.com>"; then
            echo "✔ Commit already contains official DCO sign-off. Skipping."
            exit 0
          fi

          echo "ℹ Appending official DCO sign-off to dependabot commit..."
          git commit --amend --no-edit --signoff

          echo "ℹ Force-pushing signed commit back to branch: $HEAD_REF..."
          git push --force-with-lease origin "$HEAD_REF"

          echo "✔ Successfully signed off Dependabot PR commit."
          echo "### ✍️ Dependabot DCO Sign-off Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit was successfully amended with \`Signed-off-by: dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>\`." >> "$GITHUB_STEP_SUMMARY"

