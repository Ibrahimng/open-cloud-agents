name: Scheduled Daily Codebase Audit

on:
  schedule:
    # Runs daily at 04:00 UTC (4:00 AM)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  daily-bug-hunter:
    name: Automated Bug & Regression Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Repository Hygiene Validation
        run: python3 scripts/ci/validate_repo.py

      - name: Validate 7-Agent Master Suite Contracts
        run: python3 scripts/agents/agent_pipeline.py --validate

      - name: Execute Multi-Agent Handoff Simulation
        run: python3 scripts/agents/agent_pipeline.py --simulate

      - name: Execute FinOps Cloud Waste Reaper Regression
        run: |
          ./skills/finops/cloud-waste-reaper/scripts/reap_cloud_waste.sh \
            --mock \
            --export-json /tmp/waste_report.json \
            --export-markdown /tmp/waste_report.md

      - name: Notify Maintainer on Audit Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Daily Audit Alert: Automated Bug/Regression Detected [${new Date().toISOString().split('T')[0]}]`;
            const body = `### ⚠️ Daily Codebase Audit Failure Notification\n\nThe scheduled daily codebase audit at **04:00 AM UTC** encountered an unexpected failure.\n\n- **Run URL:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Commit:** ${context.sha}\n- **Trigger:** Scheduled Cron (Daily 4:00 AM)\n\ncc: @ibrahimng please review the failure logs and apply necessary fixes.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automated-audit']
            });
