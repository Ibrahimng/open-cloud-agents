name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Binary (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    if: ${{ !env.ACT && runner.name != 'Local Actions' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: darwin
            arch: arm64
            runner: macos-latest
            binary_name: ocagents-darwin-arm64
          - os: darwin
            arch: amd64
            runner: macos-13
            binary_name: ocagents-darwin-amd64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary_name: ocagents-linux-amd64
          - os: windows
            arch: amd64
            runner: windows-latest
            binary_name: ocagents-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyyaml

      - name: Compile Hermetic Executable (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller packaging/pyinstaller/ocagents.spec
          chmod +x dist/ocagents
          mv dist/ocagents dist/${{ matrix.target.binary_name }}
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.target.binary_name }} > ${{ matrix.target.binary_name }}.sha256
          else
            shasum -a 256 ${{ matrix.target.binary_name }} > ${{ matrix.target.binary_name }}.sha256
          fi

      - name: Compile Hermetic Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller packaging/pyinstaller/ocagents.spec
          Move-Item dist\ocagents.exe dist\${{ matrix.target.binary_name }}
          Set-Location dist
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.target.binary_name }}).Hash.ToLower()
          "$hash  ${{ matrix.target.binary_name }}" | Out-File -Encoding ASCII -FilePath "${{ matrix.target.binary_name }}.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target.binary_name }}
          path: |
            dist/${{ matrix.target.binary_name }}
            dist/${{ matrix.target.binary_name }}.sha256
          retention-days: 2

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    if: always() && (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine Target Tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        run: |
          python3 -c "
          import re, os
          target_tag = '${{ steps.tag.outputs.version }}'.lstrip('v')
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(target_tag)}\][^\n]*\n(.*?)(?=\n## |\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f'Release ${{ steps.tag.outputs.version }}'
          with open('release_notes.md', 'w') as f:
              f.write(notes)
          "

      - name: Download Compiled Binaries
        if: ${{ !env.ACT && runner.name != 'Local Actions' }}
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release_assets

      - name: Consolidate Checksums
        if: ${{ !env.ACT && runner.name != 'Local Actions' }}
        run: |
          if [ -d release_assets ]; then
            cat release_assets/*.sha256 > release_assets/checksums.txt 2>/dev/null || true
            ls -la release_assets/
          fi

      - name: Preview Release Notes (Local act mode)
        if: ${{ env.ACT || runner.name == 'Local Actions' }}
        run: |
          echo "Running in local act runner. Skipping live GitHub API release call."
          echo "=== Extracted Release Notes Preview ==="
          cat release_notes.md
          echo "======================================"

      - name: Publish GitHub Release
        if: ${{ !env.ACT && runner.name != 'Local Actions' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Open Cloud Agents ${{ steps.tag.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release_assets/ocagents-darwin-arm64
            release_assets/ocagents-darwin-amd64
            release_assets/ocagents-linux-amd64
            release_assets/ocagents-windows-amd64.exe
            release_assets/checksums.txt
