site_name: Open Cloud Agents
site_description: Autonomous, Well-Architected Cloud Engineering for Any AI Agent or IDE
site_author: Ibrahim Jimoh
site_url: https://ibrahimng.github.io/open-cloud-agents/
repo_url: https://github.com/open-cloud-agents/ocagents
repo_name: open-cloud-agents/ocagents
edit_uri: edit/main/

docs_dir: build_docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    # Scheme toggle for light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Scheme toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: info
  unrecognized_links: ignore

